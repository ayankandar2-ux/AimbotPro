name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            ndk;25.1.8937393
            cmake;3.22.1

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found, generating..."
            wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
            unzip gradle.zip -d /tmp/
            /tmp/gradle-8.4/bin/gradle wrapper
            rm -rf gradle.zip /tmp/gradle-8.4
          else
            echo "gradlew found."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimbotPro-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
