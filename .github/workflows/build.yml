name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Fix for the Node 20 deprecation warning
    env:
      ACTIONS_ALLOW_USE_NODE20: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Keep your working license fix
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        shell: bash

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NEW: Make the Gradle wrapper executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # NEW: Actually build the APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # NEW: Upload the APK so you can download it
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
