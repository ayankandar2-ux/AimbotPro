name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ACTIONS_ALLOW_USE_NODE20: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NEW STEP: List files to see where your project is
      - name: List root directory
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        shell: bash

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # FIXED: Handles nested folder structure
      - name: Make gradlew executable
        run: |
          chmod +x gradlew || chmod +x android/gradlew

      # FIXED: Runs the correct build command based on location
      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            cd android && ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
