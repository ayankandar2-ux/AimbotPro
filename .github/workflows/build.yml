name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Fix for the Node 20 deprecation warning
    env:
      ACTIONS_ALLOW_USE_NODE20: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- THE CRITICAL FIX ---
      # Piping "yes" to sdkmanager automatically accepts all licenses 
      # (including the Google TV Add-on license) and writes the hash files, 
      # preventing the interactive prompt that caused the failure.
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        shell: bash

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Add your actual build steps here (e.g., Building with Gradle)
      # - name: Build with Gradle
      #   run: ./gradlew assembleDebug
